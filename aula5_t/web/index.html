<!DOCTYPE html>
<html>
    <head>
        <title>Cadastro</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="img/logotipo.png"/>
        <link href="css/style.css" rel="stylesheet" type="text/css"/>
    </head>
    <body>
        
        <header>
            <nav>
                <a href="index.html">
                    <img src="img/logotipo.png" alt="logo do site" id="logo"/>
                </a>
                <a href="index.html">
                    <img src="img/menu.png" alt="menu do site" id="menu"/>
                </a>
                
            </nav>
            
            <h1>Cadastro</h1>
        </header>
        
        <main>
            <form action="#" method="get">
                <div>
                    <label for="nome"> Nome: </label>
                    <input type="text" id="nome" name="nome" placeholder="Nome completo..." minlength="4" maxlength="50" required>
                </div>
                
                <div>
                    <label for="cpf">CPF: </label>
                    <input type="tel" pattern="[0-9]{3}.[0-9]{3}.[0-9}{3}-[0-9]{2}" id="cpf" name="cpf" placeholder="123.456.789-10" maxlength="14" required>
                </div>
                
                <div>
                    <label for="telefone">Telefone: </label>
                    <input type="tel" pattern="[1-9]{2}-9[0-9]{4}.[0-9]{4}" id="telefone" name="telefone" placeholder="XX-90000.0000" maxlength="13" required>
                </div>
                
                <div>
                    <label for="email"> E-mail: </label>
                    <input type="email" id="email" name="email" placeholder="Endereço de e-mail" minlength="4" maxlength="50" required>
                </div>
                
                <div>
                    <label for="data-nasc"> Data de nascimento: </label>
                    <input type="date" id="data-nasc" name="data-nasc" max="2016-06-01" required>
                </div>
                
                <div>
                    <label for="senha">Senha: </label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" minlength="8" required>
                </div>
                <div>
                    <label for="senha-conf">Confirme sua senha: </label>
                    <input type="password" id="senha-conf" name="senha-conf" placeholder="Confirme sua senha" minlength="8" required>
                </div>
                <div>
                    <input type="checkbox" id="notif" name="notif" checked>
                    <label for="notif">Deseja receber nossos avisos?</label>
                    
                    
                </div>
                <div>
                    <input type="submit" value="CADASTRAR">
                </div>
                
            </form>
        </main>
        
        <footer>
            <hr>
            <small>
                2026 - Nenhum direito reservado &copy;
            </small>
        </footer>
    
    
    </body>
</html>
